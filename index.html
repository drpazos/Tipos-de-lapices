<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspots Interactivos - Lápices (1º ESO)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; }

        body {
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            font-family: 'Outfit', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            max-width: 1450px;
            width: 100%;
            margin: 0 auto;
        }

        .taller-interactivo {
            position: relative;
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: auto;
            border: 1px solid var(--border);
            text-align: center;
        }

        .img-container {
            position: relative;
            display: inline-block;
            width: 100%;
            min-height: 400px;
            text-align: left;
            background: white;
        }

        .img-panel {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Hotspot con animación de pulso (+) */
        .punto-taller {
            position: absolute;
            width: 32px;
            height: 32px;
            background-color: #2563eb;
            color: #fff;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 3px 10px rgba(0,0,0,0.35);
            cursor: pointer;
            z-index: 20;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            opacity: 0.9;
            transition: transform 0.2s, opacity 0.2s;
            user-select: none;
        }

        .punto-taller:hover {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.25);
        }

        .punto-taller::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-color: #2563eb;
            animation: pulse-animation 2s infinite;
            z-index: -1;
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .capa-oscura {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            display: none;
            z-index: 990;
            backdrop-filter: blur(4px);
        }

        .capa-oscura.activo { display: block; }

        .ficha-herramienta {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 540px;
            max-width: 90vw;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: none;
            overflow: hidden;
        }

        .ficha-herramienta.activo { display: block; }

        .ficha-cabecera {
            background-color: #2563eb;
            color: white;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ficha-cuerpo {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .ficha-cerrar {
            background: rgba(0,0,0,0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .contenedor-video {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }

        .contenedor-video iframe,
        .contenedor-video video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="taller-interactivo">
        <div class="img-container" id="imgContainer">
            <img id="imgFondo" src="INFOGRAFIA_Lapices.png" alt="Infografía Lápices" class="img-panel">
            <div id="contenedorPuntos"></div>
        </div>
    </div>

    <div class="capa-oscura" id="overlay"></div>
    <div id="contenedorFicha"></div>
</div>

<script>
    // Datos exactos configurados y preservados por el usuario
    let LAPICES_DATOS = [
        {
            id: "h_grupo",
            nombre: "Ejemplo de Plano Técnico",
            top: 78.8,
            left: 7.6,
            video: "Video/Plano_tecnico.mp4",
            descripcion: "Vídeo donde se muestra como se hacen los planos empleando: papel, lápices y herramientas de dibujo"
        },
        {
            id: "hb_grupo",
            nombre: "Gama Medias (HB / F)",
            top: 54.1,
            left: 49.8,
            video: "Video/Tipos_de_Lapices_HB.mp4",
            descripcion: "Equilibrio perfecto para escribir apuntes en el aula y dibujar croquis y bocetos en el taller ."
        },
        {
            id: "b_grupo",
            nombre: "Gama Blandas (B)",
            top: 55.4,
            left: 91.9,
            video: "Video/Tipos_de_Lapices_B.mp4",
            descripcion: "Lápices especialmente diseñados para el dibujo artístico , ya que permiten lograr sombras y trazos oscuros."
        },
        {
            id: "punto_1793485962744",
            nombre: "¿Cómo se fabrica un lápiz?",
            top: 9.2,
            left: 52.2,
            video: "https://www.youtube.com/watch?v=SBM5yAgLC7g",
            descripcion: "Vídeo donde se explica como la marca alemana Faber-Castell hace sus lápices de colores"
        },
        {
            id: "punto_1793486105944",
            nombre: "Gama Duras (H)",
            top: 55.5,
            left: 7.7,
            video: "Video/Tipos_de_Lapices_H.mp4",
            descripcion: "Minas duras recomendadas para líneas auxiliares y dibujo técnico de precisión."
        },
        {
            id: "punto_1793486529799",
            nombre: "Ejemplo de dibujo de bocetos con lápices HB",
            top: 78.4,
            left: 48.3,
            video: "Video/Industrial_design.mp4",
            descripcion: "Vídeo donde se muestra como un diseñador industrial emplea lápices HB para hacer bocetos."
        },
        {
            id: "punto_1793486647044",
            nombre: "Ejemplo de dibujo artístico usando lápices de la gama B",
            top: 78.7,
            left: 92.8,
            video: "Video/BOCETO_Artistico.mp4",
            descripcion: "Vídeo donde se muestra una artista emplea los lápices de la gama B para lograr un sombreado realista en un dibujo. "
        }
    ];

    const contenedorPuntos = document.getElementById('contenedorPuntos');

    function renderizarPuntos() {
        contenedorPuntos.innerHTML = '';
        LAPICES_DATOS.forEach((lapiz) => {
            const punto = document.createElement('div');
            punto.className = 'punto-taller';
            punto.style.top = `${lapiz.top}%`;
            punto.style.left = `${lapiz.left}%`;
            punto.textContent = '+';

            punto.addEventListener('click', () => {
                mostrarFichaModal(lapiz);
            });

            contenedorPuntos.appendChild(punto);
        });
    }

    function procesarUrlVideo(url) {
        if (!url) return '<p style="color:white; text-align:center; padding:20px;">Vídeo no disponible</p>';
        // Limpiamos barras invertidas por si acaso en las rutas locales
        let rutaLimpia = url.replace(/\\/g, '/');

        if (rutaLimpia.includes('youtube.com') || rutaLimpia.includes('youtu.be')) {
            let videoId = '';
            if (rutaLimpia.includes('youtu.be/')) {
                videoId = rutaLimpia.split('youtu.be/')[1].split('?')[0];
            } else if (rutaLimpia.includes('watch?v=')) {
                videoId = rutaLimpia.split('watch?v=')[1].split('&')[0];
            }
            if (videoId) {
                return `<div class="contenedor-video"><iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe></div>`;
            }
        }
        return `<div class="contenedor-video"><video src="${rutaLimpia}" controls style="width:100%; height:100%;"></video></div>`;
    }

    function mostrarFichaModal(lapiz) {
        const contenedorFicha = document.getElementById('contenedorFicha');
        const overlay = document.getElementById('overlay');
        const videoHtml = procesarUrlVideo(lapiz.video);
        
        contenedorFicha.innerHTML = `
            <div class="ficha-herramienta activo">
                <div class="ficha-cabecera">
                    <h2 style="margin:0; font-size:19px;">${lapiz.nombre}</h2>
                    <button class="ficha-cerrar" onclick="cerrarModal()">✕</button>
                </div>
                <div class="ficha-cuerpo">
                    ${videoHtml}
                    <p style="font-size:15px; color:#334155; line-height:1.6; margin:0;">${lapiz.descripcion}</p>
                </div>
            </div>
        `;
        overlay.classList.add('activo');
    }

    window.cerrarModal = function() {
        document.getElementById('contenedorFicha').innerHTML = '';
        document.getElementById('overlay').classList.remove('activo');
    };

    renderizarPuntos();
</script>

</body>
</html>
